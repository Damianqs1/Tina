mcs.metadata:
  componentName: Support Request English
  description: |-
    Use this topic when the user wants to create, open, submit, or formally report an IT support ticket or support request.

    This topic handles requests to create a Jira or IT support ticket for an IT issue. Use it when the user explicitly wants to submit or report the issue, including requests such as "I need to create a ticket", "I want to open a ticket", or "I want to report this issue".

    Do not use this topic only because troubleshooting was unsuccessful if the user has not indicated that they want to submit or report the issue.
kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user wants to formally report an IT issue or create, open, submit, or register a support ticket or support request.

  Use this topic when the user explicitly asks to create a Jira/IT support ticket, report an unresolved technical issue, or submit a request for IT support.

  Do not use this topic only because a technical issue could not be resolved. The user must indicate that they want to formally report or submit the issue.
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: Question
      id: question_lYbmH7
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Option
      prompt: I couldn't resolve the issue. Would you like me to create a support request for you?
      entity:
        kind: EmbeddedEntity
        definition:
          kind: ClosedListEntity
          items:
            - id: Yes
              displayName: Yes

            - id: No
              displayName: No

    - kind: ConditionGroup
      id: conditionGroup_MmHwN3
      conditions:
        - id: conditionItem_VIrWPI
          condition: =Topic.Option = 'new_TinaTest.topic.Untitled.main.question_lYbmH7'.Yes

        - id: conditionItem_0bsI86
          condition: =Topic.Option = 'new_TinaTest.topic.Untitled.main.question_lYbmH7'.No
          actions:
            - kind: EndDialog
              id: nrPIfj

      elseActions:
        - kind: GotoAction
          id: B0EAiF
          actionId: question_lYbmH7

    - kind: Question
      id: question_WUsQwa
      interruptionPolicy:
        allowInterruption: false

      unrecognizedPrompt: "Please select one of the available options: Email, Phone, or Teams."
      alwaysPrompt: true
      variable: init:Topic.MethodContact
      prompt: "Preferred method of contact:"
      entity:
        kind: ClosedListEntityReference
        entityId: new_TinaTest.entity.PreferredMethodOfCommunication
        selectedItems:
          - T6TCQ3
          - MLGeIK
          - cpsRFf

    - kind: Question
      id: question_K01wGs
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Title
      prompt: Short description of what's happening or what you need
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_ekohXC
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Description
      prompt: Describe your issue or question
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_3wg0Ax
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Application
      prompt: Which application or system is related to this?
      entity: StringPrebuiltEntity

