mcs.metadata:
  componentName: Greeting
  description: This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - 
        speak:
          - Hello, <break strength="medium" /> how can I help?
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              {
                "type": "AdaptiveCard",
                "$schema": "https://adaptivecards.io/schemas/adaptive-card.json",
                "version": "1.5",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": "Hello, how can I help you today?",
                    "size": "ExtraLarge",
                    "horizontalAlignment": "Center",
                    "weight": "Bolder",
                    "wrap": true
                  },
                  {
                    "type": "Image",
                    "url": "https://abacenter.sharepoint.com/:i:/r/sites/ABAMarketingDepartment/Logos/Tina/Wink.png?d=w62e957e60c5249d8a9040ac60263b612&csf=1&web=1&e=DFCIxH",
                    "horizontalAlignment": "Center",
                    "height": "200px"
                  }
                ]
              }

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22