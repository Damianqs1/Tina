mcs.metadata:
  componentName: Create IT Incident English
  description: |-
    Use this topic when the user wants to create, open, or submit an IT incident.

    Use this topic when the user wants to formally report a technical issue, system failure, service disruption, or other IT incident that requires investigation or resolution.
kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user wants to create, open, submit, or formally report an IT incident.

  This topic is used for technical issues, system failures, service disruptions, application failures, device problems, or other IT incidents that require investigation or resolution.

  Do not use this topic for general IT questions, informational requests, or requests for routine assistance that do not represent an incident.
beginDialog:
  kind: OnRedirect
  id: main
  actions:
    - kind: Question
      id: question_WUsQwa
      interruptionPolicy:
        allowInterruption: false

      unrecognizedPrompt: "Please select one of the available options: Email, Phone, or Teams."
      alwaysPrompt: true
      variable: init:Topic.MethodContact
      prompt: "Preferred method of contact:"
      entity:
        kind: ClosedListEntityReference
        entityId: new_TinaTest.entity.PreferredMethodOfCommunication
        selectedItems:
          - T6TCQ3
          - MLGeIK
          - cpsRFf

    - kind: Question
      id: question_K01wGs
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Title
      prompt: Short description of what's happening or what you need
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_ekohXC
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Description
      prompt: Describe your issue or question
      entity: StringPrebuiltEntity

    - kind: Question
      id: question_3wg0Ax
      interruptionPolicy:
        allowInterruption: true

      variable: init:Topic.Application
      prompt: Which application or system is related to this?
      entity: StringPrebuiltEntity

