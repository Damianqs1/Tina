                  type: "AdaptiveCard",
                  version: "1.5",

                  body:
                  [
                      // ==========================================
                      // INCIDENTS TITLE
                      // ==========================================
                      {
                          type: "TextBlock",
                          text: "INCIDENTS",
                          size: "Large",
                          weight: "Bolder",
                          color: "Accent",
                          horizontalAlignment: "Center",
                          spacing: "None"
                      },

                      // ==========================================
                      // INCIDENTS
                      // ==========================================
                      {
                          type: "Container",
                          style: "emphasis",

                          items:
                              ForAll(
                                  Topic.IncidentResults,

                                  {
                                      type: "ColumnSet",
                                      spacing: "Small",
                                      verticalContentAlignment: "Center",

                                      columns:
                                      [
                                          // --------------------------
                                          // TICKET NUMBER
                                          // --------------------------
                                          {
                                              type: "Column",
                                              width: "auto",
                                              verticalContentAlignment: "Center",

                                              items:
                                              [
                                                  {
                                                      type: "TextBlock",
                                                      text: ThisRecord.number,
                                                      weight: "Bolder",
                                                      wrap: true
                                                  }
                                              ]
                                          },

                                          // --------------------------
                                          // DESCRIPTION
                                          // --------------------------
                                          {
                                              type: "Column",
                                              width: "stretch",
                                              verticalContentAlignment: "Center",

                                              items:
                                              [
                                                  {
                                                      type: "TextBlock",
                                                      text: ThisRecord.short_description,
                                                      horizontalAlignment: "Center",
                                                      wrap: true,
                                                      maxLines: 2
                                                  }
                                              ]
                                          },

                                          // --------------------------
                                          // CREATED DATE
                                          // --------------------------
                                          {
                                              type: "Column",
                                              width: "auto",
                                              verticalContentAlignment: "Center",

                                              items:
                                              [
                                                  {
                                                      type: "TextBlock",
                                                      text: Left(ThisRecord.opened_at, 10),
                                                      wrap: true,
                                                      size: "Small",
                                                      color: "Accent"
                                                  }
                                              ]
                                          },

                                          // --------------------------
                                          // STATE
                                          // --------------------------
                                          {
                                              type: "Column",
                                              width: "auto",
                                              verticalContentAlignment: "Center",

                                              items:
                                              [
                                                  {
                                                      type: "TextBlock",

                                                      text:
                                                          Switch(
                                                              ThisRecord.state,
                                                              "1", "New",
                                                              "2", "In Progress",
                                                              "3", "On Hold",
                                                              "6", "Resolved",
                                                              "7", "Closed",
                                                              "8", "Canceled",
                                                              ThisRecord.state
                                                          ),

                                                      wrap: true,
                                                      size: "Small",
                                                      weight: "Bolder"
                                                  }
                                              ]
                                          },

                                          // --------------------------
                                          // OPEN BUTTON
                                          // --------------------------
                                          {
                                              type: "Column",
                                              width: "auto",
                                              verticalContentAlignment: "Center",

                                              items:
                                              [
                                                  {
                                                      type: "ActionSet",

                                                      actions:
                                                      [
                                                          {
                                                              type: "Action.OpenUrl",
                                                              title: "Open",

                                                              url:
                                                                  Concatenate(
                                                                      "https://icbd.service-now.com/esc?id=ticket&table=incident&sys_id=",
                                                                      ThisRecord.sys_id
                                                                  ),

                                                              style: "positive"
                                                          }
                                                      ]
                                                  }
                                              ]
                                          }
                                      ]
                                  }
                              )
                      },

                      // ==========================================
                      // REQUESTS TITLE
                      // ==========================================
