mcs.metadata:
  componentName: Colombia Employee Photo Gallery
  description: Use this topic when the user asks to find, locate, access, or view employee photos from Colombia, including questions about where Colombia employee photos are stored or requests for photos of Colombia-based employees.
kind: AdaptiveDialog
modelDescription: |-
  Use this topic when the user asks to find, view, or locate photos of employees based in Colombia, or asks about the Colombia employee photo gallery.

  Examples include:
  - Fotos de empleados de Colombia
  - Foto de un empleado de Colombia
  - Fotos de Colombia
  - Galería de fotos de Colombia
  - Colombia employee photos
  - Colombia employee photo gallery
  - Dónde están las fotos de los empleados de Colombia
  - Dónde guardan las fotos de los empleados de Colombia

  Use this topic specifically for the Colombia Employee Photo Gallery.
  Do not use it for U.S. photo galleries, general company photos, events, marketing media, or unrelated HR information.
