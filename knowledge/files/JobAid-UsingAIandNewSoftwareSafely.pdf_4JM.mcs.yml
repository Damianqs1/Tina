mcs.metadata:
  componentName: Using AI Tools Safely in the Workplace Description
  description: Reference guide for ICBD and Affiliates employees on the safe and responsible use of artificial intelligence tools in the workplace. It covers approved and prohibited AI tools, account requirements, protection of confidential information, client, patient, and employee data, meeting recordings and transcriptions, software installation and procurement requirements, and procedures for reporting unapproved tools or requesting new AI solutions.
